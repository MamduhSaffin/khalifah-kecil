<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d35"><link rel="manifest" href="manifest.webmanifest">
<title>Khalifah Kecil — Impossible → Possible</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17342e;background:#f5f1e8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eaf5ed,#fff9ed)}
main{max-width:720px;margin:auto;padding:20px 18px 110px}.brand{font-weight:900;letter-spacing:.04em;color:#174f42}.tag{font-size:.8rem;color:#6d766f}
.card{background:#fff;border:1px solid #dce7df;border-radius:28px;padding:24px;box-shadow:0 12px 34px #17342e12;margin-top:18px}
h1{font-size:clamp(2rem,9vw,4rem);line-height:1;margin:.25em 0}.lead{font-size:1.15rem;line-height:1.55;color:#42544e}
button,.choice{width:100%;border:0;border-radius:18px;padding:16px 18px;margin-top:10px;font-size:1rem;font-weight:800;cursor:pointer}
.primary{background:#174f42;color:white}.secondary{background:#edf5ef;color:#174f42}.choice{text-align:left;background:#f7f8f3;border:1px solid #e1e6df}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hero-grid button{min-height:115px;margin:0;font-size:1.05rem}
input,select,textarea{width:100%;padding:14px;border:1px solid #cfdad3;border-radius:14px;font:inherit;margin:6px 0 12px}
.pill{display:inline-block;background:#f0dba8;padding:7px 11px;border-radius:99px;font-size:.8rem;font-weight:800}.bigemoji{font-size:5rem;text-align:center}
.progress{height:8px;background:#e6ece7;border-radius:99px;overflow:hidden;margin:12px 0 22px}.progress i{display:block;height:100%;background:#d39d2a}
.offline{text-align:center;background:#17342e;color:white}.offline .lead{color:#e5eee9}
.note{font-size:.88rem;color:#68756f}.summary{background:#f4f8f4;padding:14px;border-radius:16px;margin:10px 0}
footer{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(10px);border-top:1px solid #dfe8e2;padding:10px;text-align:center;font-size:.75rem;color:#60716a}
</style>
</head>
<body><main><header><div class="brand">🌟 KHALIFAH KECIL</div><div class="tag">Impossible → Possible · Prototaip v0.1</div></header><div id="app"></div></main>
<footer>Fikir dahulu · Cuba di dunia sebenar · Belajar · Baiki · Bantu</footer>
<script>
const S={step:+localStorage.kkStep||0,name:localStorage.kkName||"",age:localStorage.kkAge||"8",hero:localStorage.kkHero||"",result:localStorage.kkResult||"",improve:localStorage.kkImprove||""};
const app=document.querySelector("#app"); const save=()=>{for(const k in S)localStorage["kk"+k[0].toUpperCase()+k.slice(1)]=S[k]};
function go(n){S.step=n;save();render();scrollTo(0,0)} function btn(t,n,c="primary"){return `<button class="${c}" onclick="go(${n})">${t}</button>`}
function shell(n,title,body){return `<div class="progress"><i style="width:${n*10}%"></i></div><section class="card"><span class="pill">MISI LANGIT · ${n}/10</span><h1>${title}</h1>${body}</section>`}
function render(){
if(S.step===0)app.innerHTML=`<section class="card"><div class="bigemoji">🌍✨</div><h1>Bayangkan. Tanya. Temui.</h1><p class="lead">Skrin ini bukan tempat pengembaraan kamu berakhir. Ia tempat pengembaraan kamu <b>bermula</b>.</p>${btn("Mula pengembaraan →",1)}</section>`;
if(S.step===1)app.innerHTML=shell(1,"Siapa pencipta kecil kita?",`<label>Nama panggilan</label><input id="nm" value="${S.name}" placeholder="Contoh: Aiman"><label>Umur</label><select id="ag"><option>7</option><option ${S.age==="8"?"selected":""}>8</option><option>9</option></select><button class="primary" onclick="S.name=document.querySelector('#nm').value||'Pencipta';S.age=document.querySelector('#ag').value;go(2)">Teruskan →</button><p class="note">Prototaip ini menyimpan kemajuan pada peranti ini sahaja.</p>`);
if(S.step===2)app.innerHTML=shell(2,"Pilih kuasa impianmu",`<p class="lead">Kalau kamu boleh mempunyai satu kuasa, apakah yang kamu pilih?</p><div class="hero-grid"><button class="choice" onclick="S.hero='Langit';go(3)">🪽<br>LANGIT<br><small>Saya mahu terbang!</small></button><button class="choice" onclick="S.hero='Lautan';go(3)">🌊<br>LAUTAN<br><small>Teroka dasar laut!</small></button><button class="choice" onclick="S.hero='Kuasa';go(3)">💪<br>KUASA<br><small>Jadi sangat kuat!</small></button><button class="choice" onclick="S.hero='Minda';go(3)">🧠<br>MINDA<br><small>Selesaikan misteri!</small></button></div><p class="note">Dalam v0.1, semua pilihan membuka Misi Langit untuk menguji pengalaman pertama.</p>`);
if(S.step===3)app.innerHTML=shell(3,"Kamu mahu terbang!",`<div class="bigemoji">🪽</div><p class="lead">Tetapi ada satu masalah, ${S.name}. Manusia tidak mempunyai sayap seperti burung.</p><h2>Adakah itu bermaksud manusia tidak boleh terbang?</h2>${btn("Saya nak siasat! 🔍",4)}`);
if(S.step===4)app.innerHTML=shell(4,"Fikir dahulu",`<p class="lead">Mengapa manusia tidak boleh terbang seperti burung?</p><button class="choice" onclick="go(5)">🪽 Kita tiada sayap seperti burung</button><button class="choice" onclick="go(5)">⚖️ Badan kita berbeza</button><button class="choice" onclick="go(5)">💡 Saya ada idea lain</button><p class="note">Tiada markah. Kita mahu kamu berfikir sebelum melihat jawapan.</p>`);
if(S.step===5)app.innerHTML=shell(5,"Misi dunia sebenar",`<p class="lead"><b>Bolehkah kamu membuat sesuatu daripada kertas yang boleh bergerak melalui udara?</b></p><div class="summary">Cari 3 keping kertas terpakai. Buat tiga bentuk: 📄 kertas rata · ⚪ kertas diramas · ✈️ kapal terbang kertas. Cuba semuanya.</div><h2>📵 Sekarang letak telefon.</h2><p>Pengembaraan sebenar sedang menunggu.</p>${btn("Saya pergi mencuba! →",6)}`);
if(S.step===6)app.innerHTML=`<section class="card offline"><div class="bigemoji">🔬</div><h1>Eksperimen sedang berjalan</h1><p class="lead">Jangan tengok saya 😄<br>Pergi cuba ketiga-tiga reka bentuk kamu.</p>${btn("Saya sudah kembali",7,"secondary")}</section>`;
if(S.step===7)app.innerHTML=shell(7,"Apa yang berlaku?",`<p class="lead">Pilih yang paling hampir dengan pengalaman kamu.</p><button class="choice" onclick="S.result='Berjaya';go(8)">😀 Ia berjaya!</button><button class="choice" onclick="S.result='Sedikit';go(8)">🤏 Berjaya sedikit</button><button class="choice" onclick="S.result='Tidak';go(8)">💥 Tak menjadi langsung</button><button class="choice" onclick="S.result='Belum';go(8)">😅 Saya belum cuba</button>`);
if(S.step===8)app.innerHTML=shell(8,"Bagus. Kita ada maklumat.",`<p class="lead">Pencipta tidak takut apabila sesuatu tidak menjadi seperti dijangka. Mereka bertanya: <b>apa yang boleh saya ubah?</b></p><button class="choice" onclick="S.improve='Sayap';go(9)">🪽 Bentuk sayap</button><button class="choice" onclick="S.improve='Berat';go(9)">⚖️ Berat</button><button class="choice" onclick="S.improve='Bentuk';go(9)">📐 Bentuk badan</button><button class="choice" onclick="S.improve='Lontaran';go(9)">💨 Cara melontar</button>`);
if(S.step===9)app.innerHTML=shell(9,"Manusia juga pernah mencuba",`<div class="bigemoji">✈️🚁</div><p class="lead">Manusia tidak memperoleh kuasa ajaib untuk terbang. Melalui pemerhatian, ilmu, percubaan dan penambahbaikan, manusia membangunkan pelbagai teknologi penerbangan.</p><div class="summary">✈️ Kapal terbang · 🚁 Helikopter · 🪂 Payung terjun · 🚀 Roket</div><h2>Jadi imaginasi kamu bodoh?</h2><p><b>Tidak.</b> Imaginasi boleh memberi kita soalan. Ilmu membantu kita mengetahui apa yang benar-benar boleh dilakukan.</p>${btn("Akhiri misi →",10)}`);
if(S.step===10)app.innerHTML=shell(10,"Ilmu untuk membantu",`<p class="lead">Teknologi penerbangan boleh digunakan untuk menyelamat, membawa bantuan, penyelidikan dan menghubungkan manusia.</p><h2>Kalau kamu seorang pencipta, siapa yang kamu mahu bantu?</h2><textarea id="help" rows="3" placeholder="Ceritakan idea kamu..."></textarea><button class="primary" onclick="localStorage.kkHelp=document.querySelector('#help').value;localStorage.kkCompleted='1';go(11)">Simpan dalam Pasport 🌟</button>`);
if(S.step===11)app.innerHTML=`<section class="card"><div class="bigemoji">🌟</div><h1>Misi selesai, ${S.name}!</h1><p class="lead">Hari ini kamu bertanya, mencuba, memerhati, memilih sesuatu untuk diperbaiki dan memikirkan bagaimana ilmu boleh membantu orang.</p><div class="summary"><b>Pasport Pencipta #001</b><br>🪽 Misi: Bolehkah Manusia Terbang?<br>🔧 Saya mahu baiki: ${S.improve||"idea saya"}<br>❤️ Ilmu digunakan untuk manfaat.</div><h2>Itulah cara seorang pencipta berfikir.</h2><button class="secondary" onclick="localStorage.clear();location.reload()">Ulang prototaip</button></section>`;
}
render(); if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
