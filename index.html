<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d35"><link rel="manifest" href="manifest.webmanifest">
<title>Khalifah Kecil — Impossible → Possible</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17342e;background:#f5f1e8;--ink:#17342e;--green:#174f42;--cream:#fff9ed}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eaf5ed,#fff9ed)}
main{max-width:720px;margin:auto;padding:18px 16px 118px}.brand{display:flex;align-items:center;gap:8px;font-size:1.02rem}.brand:before{content:"✦";display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:#174f42;color:#fff}.tag{margin:7px 0 2px 42px;font-weight:700}.brand{font-weight:900;letter-spacing:.04em;color:#174f42}.tag{font-size:.8rem;color:#6d766f}
.card{background:#fff;border:1px solid #dce7df;border-radius:30px;padding:24px;box-shadow:0 16px 42px #17342e14;margin-top:18px;overflow:hidden;position:relative}.card:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:#f0dba83d;right:-55px;top:-55px;pointer-events:none}
h1{font-size:clamp(2rem,9vw,4rem);line-height:1;margin:.25em 0}.lead{font-size:1.15rem;line-height:1.55;color:#42544e}
button,.choice{width:100%;border:0;border-radius:20px;padding:17px 18px;margin-top:10px;font-size:1.05rem;font-weight:850;cursor:pointer;min-height:58px;transition:transform .12s ease}button:active{transform:scale(.98)}
.primary{background:#174f42;color:white}.secondary{background:#edf5ef;color:#174f42}.choice{text-align:left;background:#f7f8f3;border:1px solid #e1e6df}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hero-grid button{min-height:132px;margin:0;font-size:1.08rem}.hero-grid button:first-child{outline:3px solid #d39d2a;outline-offset:-3px}.hero-grid small{display:block;margin-top:7px;font-weight:650;line-height:1.2}
input,select,textarea{width:100%;padding:14px;border:1px solid #cfdad3;border-radius:14px;font:inherit;margin:6px 0 12px}
.pill{display:inline-block;background:#f0dba8;padding:7px 11px;border-radius:99px;font-size:.8rem;font-weight:800}.bigemoji{font-size:5.4rem;text-align:center;filter:drop-shadow(0 8px 10px #17342e18)}.mission-map{display:flex;justify-content:space-between;gap:5px;margin:16px 0}.mission-map span{height:8px;flex:1;border-radius:99px;background:#e4eae5}.mission-map .on{background:#d39d2a}.callout{background:#17342e;color:#fff;border-radius:22px;padding:18px;margin:16px 0}.callout b{color:#f4cf72}.micro{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;font-weight:900;color:#8a6a1e}.world{display:grid;gap:12px;margin:18px 0}.mission{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:22px;background:#f7f8f3;border:1px solid #e1e6df}.mission .icon{font-size:2.25rem;text-align:center}.mission h3{margin:0 0 4px}.mission p{margin:0;color:#66746e;font-size:.88rem}.mission.locked{opacity:.58}.status{font-size:.72rem;font-weight:900;padding:6px 9px;border-radius:99px;background:#edf5ef;color:#174f42}.passport{border:2px dashed #d39d2a;background:#fffaf0;border-radius:22px;padding:16px;margin:16px 0}.passport strong{font-size:1.08rem}
.progress{height:8px;background:#e6ece7;border-radius:99px;overflow:hidden;margin:12px 0 22px}.progress i{display:block;height:100%;background:#d39d2a}
.offline{text-align:center;background:#17342e;color:white}.offline .lead{color:#e5eee9}
.note{font-size:.88rem;color:#68756f}.summary{background:#f4f8f4;padding:14px;border-radius:16px;margin:10px 0}
footer{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(10px);border-top:1px solid #dfe8e2;padding:10px;text-align:center;font-size:.75rem;color:#60716a}
</style>
</head>
<body><main><header><div class="brand">🌟 KHALIFAH KECIL</div><div class="tag">IMPOSSIBLE → POSSIBLE · Prototaip v0.2</div></header><div id="app"></div></main>
<footer>Fikir dahulu · Cuba di dunia sebenar · Belajar · Baiki · Bantu</footer>
<script>
const S={step:+localStorage.kkStep||0,name:localStorage.kkName||"",age:localStorage.kkAge||"8",hero:localStorage.kkHero||"",result:localStorage.kkResult||"",improve:localStorage.kkImprove||"",idea:localStorage.kkIdea||"",retest:localStorage.kkRetest||"",home:localStorage.kkHome||"",oceanResult:localStorage.kkOceanResult||"",oceanImprove:localStorage.kkOceanImprove||"",oceanRetest:localStorage.kkOceanRetest||""};
const app=document.querySelector("#app"); const save=()=>{for(const k in S)localStorage["kk"+k[0].toUpperCase()+k.slice(1)]=S[k]};
function go(n){S.step=n;save();render();scrollTo(0,0)} function btn(t,n,c="primary"){return `<button class="${c}" onclick="go(${n})">${t}</button>`}
function shell(n,title,body){return `<div class="progress"><i style="width:${n*10}%"></i></div><section class="card"><span class="pill">MISI LANGIT · ${n}/10</span><h1>${title}</h1>${body}</section>`}
function render(){
if(S.step===0&&localStorage.kkCompleted==='1')go(12);
if(S.step===0)app.innerHTML=`<section class="card"><div class="bigemoji">🌍✨</div><div class="micro">Misi untuk dunia sebenar</div><h1>Bayangkan.<br>Tanya. Temui.</h1><p class="lead">Telefon beri kamu <b>misi</b>. Kamu bawa rasa ingin tahu itu ke dunia sebenar.</p><div class="callout">⚡ <b>Kuasa sebenar kamu:</b><br>belajar · mencuba · memperbaiki</div>${btn("Mula pengembaraan →",1)}</section>`;
if(S.step===1)app.innerHTML=shell(1,"Siapa pencipta kecil kita?",`<label>Nama panggilan</label><input id="nm" value="${S.name}" placeholder="Contoh: Aiman"><label>Umur</label><select id="ag"><option>7</option><option ${S.age==="8"?"selected":""}>8</option><option>9</option></select><button class="primary" onclick="S.name=document.querySelector('#nm').value||'Pencipta';S.age=document.querySelector('#ag').value;go(2)">Teruskan →</button><p class="note">Prototaip ini menyimpan kemajuan pada peranti ini sahaja.</p>`);
if(S.step===2)app.innerHTML=shell(2,"Pilih kuasa impianmu",`<p class="lead">Kalau kamu boleh mempunyai satu kuasa, apakah yang kamu pilih?</p><p class="note">Hari ini kita akan tukar kuasa imaginasi menjadi satu penyiasatan sebenar.</p><div class="hero-grid"><button class="choice" onclick="S.hero='Langit';go(3)">🪽<br>LANGIT<br><small>Saya mahu terbang!</small></button><button class="choice" onclick="S.hero='Lautan';go(3)">🌊<br>LAUTAN<br><small>Teroka dasar laut!</small></button><button class="choice" onclick="S.hero='Kuasa';go(3)">💪<br>KUASA<br><small>Jadi sangat kuat!</small></button><button class="choice" onclick="S.hero='Minda';go(3)">🧠<br>MINDA<br><small>Selesaikan misteri!</small></button></div><p class="note">Dalam v0.1, semua pilihan membuka Misi Langit untuk menguji pengalaman pertama.</p>`);
if(S.step===3)app.innerHTML=shell(3,"Kamu mahu terbang!",`<div class="bigemoji">🪽</div><p class="lead">Tetapi ada satu masalah, ${S.name}. Manusia tidak mempunyai sayap seperti burung.</p><h2>Adakah itu bermaksud manusia tidak boleh terbang?</h2>${btn("Saya nak siasat! 🔍",4)}`);
if(S.step===4)app.innerHTML=shell(4,"Fikir dahulu",`<p class="lead">Mengapa manusia tidak boleh terbang seperti burung?</p><button class="choice" onclick="go(5)">🪽 Kita tiada sayap seperti burung</button><button class="choice" onclick="go(5)">⚖️ Badan kita berbeza</button><button class="choice" onclick="document.querySelector('#ideaBox').hidden=false">💡 Saya ada idea lain</button><div id="ideaBox" hidden><textarea id="idea" rows="3" placeholder="Apa idea kamu?"></textarea><button class="primary" onclick="S.idea=document.querySelector('#idea').value;go(5)">Simpan idea saya →</button></div><p class="note">Tiada markah dan tiada jawapan “bodoh”. Kita mahu kamu berfikir sebelum melihat penjelasan.</p>`);
if(S.step===5)app.innerHTML=shell(5,"Misi dunia sebenar",`<p class="lead"><b>Bolehkah kamu membuat sesuatu daripada kertas yang boleh bergerak melalui udara?</b></p><div class="summary">Cari 3 keping kertas terpakai. Buat tiga bentuk: 📄 kertas rata · ⚪ kertas diramas · ✈️ kapal terbang kertas. Cuba semuanya.</div><div class="callout"><div class="micro" style="color:#f4cf72">MOMEN PALING PENTING</div><h2>📵 Telefon turun.</h2>Dunia sebenar ialah makmal kamu sekarang.</div>${btn("Saya pergi mencuba! →",6)}`);
if(S.step===6)app.innerHTML=`<section class="card offline"><div class="bigemoji">🔬</div><h1>Saya tunggu di sini 👋</h1><p class="lead">Jangan tengok skrin 😄<br><b>Lihat kertas kamu terbang.</b><br>Cuba ketiga-tiga bentuk.</p>${btn("Saya sudah kembali",7,"secondary")}</section>`;
if(S.step===7)app.innerHTML=shell(7,"Apa yang berlaku?",`<p class="lead">Pilih yang paling hampir dengan pengalaman kamu.</p><button class="choice" onclick="S.result='Berjaya';go(8)">😀 Ia berjaya!</button><button class="choice" onclick="S.result='Sedikit';go(8)">🤏 Berjaya sedikit</button><button class="choice" onclick="S.result='Tidak';go(8)">💥 Tak menjadi langsung</button><button class="choice" onclick="S.result='Belum';go(8)">😅 Saya belum cuba</button>`);
if(S.step===8)app.innerHTML=shell(8,"Bagus. Kita ada maklumat.",`<p class="lead">Pencipta tidak takut apabila sesuatu tidak menjadi seperti dijangka. Mereka bertanya: <b>apa yang boleh saya ubah?</b></p><button class="choice" onclick="S.improve='Sayap';go(85)">🪽 Bentuk sayap</button><button class="choice" onclick="S.improve='Berat';go(85)">⚖️ Berat</button><button class="choice" onclick="S.improve='Bentuk';go(85)">📐 Bentuk badan</button><button class="choice" onclick="S.improve='Lontaran';go(85)">💨 Cara melontar</button>`);
if(S.step===85)app.innerHTML=`<section class="card offline"><div class="bigemoji">🔧✈️</div><span class="pill">CUBA LAGI</span><div class="micro" style="color:#f4cf72">PENCIPTA CUBA LAGI</div><h1>Ubah satu perkara</h1><p class="lead">Kamu pilih <b>${S.improve}</b>. Sekarang ubah perkara itu sahaja dan uji sekali lagi. Dengan itu kamu boleh lihat sama ada perubahan kamu membantu.</p><h2>📵 Kembali ke makmal!</h2><p>Uji. Perhati. Bandingkan.</p><button class="secondary" onclick="go(86)">Saya sudah uji semula</button></section>`;
if(S.step===86)app.innerHTML=shell(8.8,"Adakah perubahan membantu?",`<p class="lead">Bandingkan dengan percubaan pertama. Apa yang kamu perhatikan?</p><button class="choice" onclick="S.retest='Lebih baik';go(9)">🚀 Lebih baik</button><button class="choice" onclick="S.retest='Hampir sama';go(9)">🤔 Hampir sama</button><button class="choice" onclick="S.retest='Lebih teruk';go(9)">🔍 Lebih teruk</button><p class="note">Semua keputusan berguna. Eksperimen memberi kita maklumat.</p>`);
if(S.step===9)app.innerHTML=shell(9,"Manusia juga pernah mencuba",`<div class="bigemoji">✈️🚁</div><p class="lead">Manusia tidak memperoleh kuasa ajaib untuk terbang. Melalui pemerhatian, ilmu, percubaan dan penambahbaikan, manusia membangunkan pelbagai teknologi penerbangan.</p><div class="summary">✈️ Kapal terbang · 🚁 Helikopter · 🪂 Payung terjun · 🚀 Roket</div><h2>Imaginasi → soalan → ilmu → ciptaan</h2><p>Imaginasi memberi kita soalan. Pemerhatian dan eksperimen membantu kita menguji idea. Ilmu membantu kita mengetahui apa yang benar-benar boleh dilakukan.</p>${btn("Akhiri misi →",10)}`);
if(S.step===10)app.innerHTML=shell(10,"Ilmu untuk membantu",`<p class="lead">Teknologi penerbangan boleh digunakan untuk menyelamat, membawa bantuan, penyelidikan dan menghubungkan manusia.</p><h2>Kalau kamu seorang pencipta, siapa yang kamu mahu bantu?</h2><textarea id="help" rows="3" placeholder="Ceritakan idea kamu..."></textarea><button class="primary" onclick="localStorage.kkHelp=document.querySelector('#help').value;localStorage.kkCompleted='1';go(11)">Simpan dalam Pasport 🌟</button>`);
if(S.step===11)app.innerHTML=`<section class="card"><div class="bigemoji">🌟</div><h1>Misi selesai, ${S.name}!</h1><p class="lead">Hari ini kamu bertanya, mencuba, memerhati, memilih sesuatu untuk diperbaiki dan memikirkan bagaimana ilmu boleh membantu orang.</p><div class="summary"><b>Pasport Pencipta #001</b><br>🪽 Misi: Bolehkah Manusia Terbang?<br>🧪 Percubaan pertama: ${S.result||"direkod"}<br>🔧 Saya ubah: ${S.improve||"idea saya"}<br>🔁 Selepas ubah: ${S.retest||"diuji semula"}<br>❤️ Saya fikir bagaimana ilmu boleh memberi manfaat.</div><h2>Kuasa sebenar kamu: belajar, mencuba dan memperbaiki.</h2><p class="lead">Masalah tidak semestinya mempunyai jawapan mudah. Tetapi setiap masalah memberi kita sesuatu untuk disiasat.</p><button class="primary" onclick="go(12)">Buka Dunia Khalifah →</button><button class="secondary" onclick="localStorage.clear();location.reload()">Ulang prototaip</button></section>`;
if(S.step===12)app.innerHTML=`<section class="card"><div class="micro">DUNIA KHALIFAH</div><h1>Pengembaraan kamu baru bermula.</h1><p class="lead">Setiap misi bermula dengan sesuatu yang membuat kita tertanya-tanya. Kemudian kita keluar, cuba, belajar dan gunakan ilmu dengan baik.</p><div class="passport"><strong>🌟 Pasport ${S.name||'Pencipta'}</strong><br><span class="note">${localStorage.kkOceanCompleted==='1'?'2':'1'} misi diterokai · data disimpan pada peranti ini</span><div class="summary">🪽 <b>Bolehkah Manusia Terbang?</b><br>🧪 ${S.result||'Dicuba'} → 🔧 ${S.improve||'Dibaiki'} → 🔁 ${S.retest||'Diuji semula'}</div>${localStorage.kkOceanCompleted==='1'?'<div class="summary">🌊 <b>Bolehkah Manusia Meneroka di Bawah Air?</b><br>🧪 '+(S.oceanResult||'Dicuba')+' → 🔧 '+(S.oceanImprove||'Dibaiki')+' → 🔁 '+(S.oceanRetest||'Diuji semula')+'</div>':''}</div><h2>Peta Misi</h2><div class="world"><div class="mission"><div class="icon">🪽</div><div><h3>Misi 01 · Langit</h3><p>Bolehkah manusia terbang?</p></div><span class="status">SELESAI</span></div><div class="mission" onclick="go(20)" style="cursor:pointer"><div class="icon">🌊</div><div><h3>Misi 02 · Lautan</h3><p>Bolehkah manusia meneroka di bawah air?</p></div><span class="status">${localStorage.kkOceanCompleted==='1'?'SELESAI':'MULA →'}</span></div><div class="mission locked"><div class="icon">💪</div><div><h3>Misi 03 · Kuasa</h3><p>Bagaimana kita mengangkat benda sangat berat?</p></div><span class="status">AKAN DATANG</span></div><div class="mission locked"><div class="icon">🌱</div><div><h3>Misi 04 · Alam</h3><p>Bolehkah kita membantu tumbuhan ketika kita tiada?</p></div><span class="status">AKAN DATANG</span></div><div class="mission locked"><div class="icon">❤️</div><div><h3>Misi 05 · Rumah</h3><p>Cari satu masalah sebenar untuk disiasat.</p></div><span class="status">AKAN DATANG</span></div></div><div class="callout">👀 <b>Lihat → Tanya → Cari → Fikir → Buat → Cuba → Baiki → Bantu</b><br><small>Itulah jalan seorang Khalifah Pencipta.</small></div><button class="secondary" onclick="S.step=3;save();render();scrollTo(0,0)">Ulang Misi Langit</button></section>`;
if(S.step===20)app.innerHTML=shell(1,"Bolehkah manusia hidup di bawah air?",`<div class="bigemoji">🌊🤿</div><p class="lead">Ikan boleh mengambil oksigen daripada air dengan insang. Kita pula bernafas dengan paru-paru.</p><h2>Kalau manusia mahu meneroka lebih lama di bawah air, apa masalah yang perlu kita selesaikan?</h2><button class="choice" onclick="go(21)">💨 Kita perlukan udara untuk bernafas</button><button class="choice" onclick="go(21)">👀 Kita perlu melihat dan bergerak dengan selamat</button><button class="choice" onclick="go(21)">💡 Saya mahu siasat kedua-duanya</button>`);
if(S.step===21)app.innerHTML=shell(2,"Jangan lihat jawapan dahulu",`<p class="lead">Bayangkan kamu seorang pencipta. Bagaimana kamu boleh membawa <b>udara</b> bersama manusia di bawah air?</p><textarea id="oidea" rows="3" placeholder="Lukis di kertas atau tulis idea ringkas di sini..."></textarea><button class="primary" onclick="localStorage.kkOceanIdea=document.querySelector('#oidea').value;go(22)">Saya ada idea →</button>`);
if(S.step===22)app.innerHTML=shell(3,"Eksperimen: udara yang tersembunyi",`<p class="lead">Kita tidak akan bernafas di bawah air. Kita cuma mahu <b>melihat bahawa udara boleh terperangkap</b>.</p><div class="summary">Kamu perlukan: 🥣 mangkuk air · 🥤 cawan plastik lutsinar · 🧻 sekeping tisu.<br><br>1. Gumpalkan tisu di dasar dalam cawan supaya tidak jatuh.<br>2. Terbalikkan cawan lurus ke bawah.<br>3. Tekan cawan ke dalam air tanpa mencondongkannya.<br>4. Angkat dan periksa tisu.</div><div class="callout">⚠️ <b>Keselamatan:</b> guna mangkuk kecil di atas meja. Jangan letak muka dalam air. Minta orang dewasa membantu jika perlu.</div><h2>📵 Telefon turun. Makmal bermula.</h2><button class="primary" onclick="go(23)">Saya pergi mencuba →</button>`);
if(S.step===23)app.innerHTML=`<section class="card offline"><div class="bigemoji">🌊🥤</div><h1>Saya tunggu di sini 👋</h1><p class="lead">Tekan cawan <b>lurus</b> ke dalam air. Kemudian periksa tisu.</p><button class="secondary" onclick="go(24)">Saya sudah kembali</button></section>`;
if(S.step===24)app.innerHTML=shell(5,"Apa yang kamu perhatikan?",`<button class="choice" onclick="S.oceanResult='Tisu kekal kering';go(25)">😮 Tisu kekal kering</button><button class="choice" onclick="S.oceanResult='Tisu sedikit basah';go(25)">💧 Tisu sedikit basah</button><button class="choice" onclick="S.oceanResult='Tisu sangat basah';go(25)">🌧️ Tisu sangat basah</button><p class="note">Tiada keputusan “gagal”. Kita gunakan hasil untuk menyiasat apa yang berlaku.</p>`);
if(S.step===25)app.innerHTML=shell(6,"Sekarang ubah satu perkara",`<p class="lead">Apa akan berlaku jika kamu <b>mencondongkan cawan sedikit</b> ketika berada di dalam air?</p><button class="choice" onclick="S.oceanImprove='Condongkan cawan';go(26)">🫧 Saya jangka udara akan keluar sebagai gelembung</button><button class="choice" onclick="S.oceanImprove='Condongkan cawan';go(26)">💧 Saya jangka lebih banyak air akan masuk</button><button class="choice" onclick="S.oceanImprove='Condongkan cawan';go(26)">🤔 Saya tak pasti — saya mahu lihat</button>`);
if(S.step===26)app.innerHTML=`<section class="card offline"><div class="bigemoji">🫧</div><div class="micro" style="color:#f4cf72">CUBA LAGI</div><h1>Condong sedikit. Perhatikan.</h1><p class="lead">Apa terjadi pada udara? Ada gelembung? Adakah air mengambil ruangnya?</p><button class="secondary" onclick="go(27)">Saya sudah uji semula</button></section>`;
if(S.step===27)app.innerHTML=shell(8,"Apa yang berubah?",`<button class="choice" onclick="S.oceanRetest='Gelembung keluar dan air masuk';go(28)">🫧 Gelembung keluar dan air masuk</button><button class="choice" onclick="S.oceanRetest='Saya nampak perubahan lain';go(28)">🔍 Saya nampak perubahan lain</button><button class="choice" onclick="S.oceanRetest='Saya belum pasti';go(28)">🤔 Saya belum pasti</button>`);
if(S.step===28)app.innerHTML=shell(9,"Daripada udara terperangkap kepada teknologi",`<div class="bigemoji">🤿🚢</div><p class="lead">Cawan tadi menunjukkan satu idea asas: <b>udara mengambil ruang</b>. Manusia tidak boleh bernafas di bawah air seperti ikan, jadi teknologi membantu kita membawa atau membekalkan udara dan membina ruang yang sesuai.</p><div class="summary">🤿 Penyelam membawa bekalan gas pernafasan dalam silinder scuba.<br>🚢 Kapal selam mempunyai ruang dalaman berisi udara dan sistem sokongan hidup.<br>🤖 ROV pula membolehkan kita meneroka tanpa menghantar manusia ke tempat tertentu.</div><p class="note">Eksperimen cawan bukan model penuh scuba atau kapal selam. Ia hanya membantu kita menyiasat satu konsep: udara mengambil ruang.</p><button class="primary" onclick="go(29)">Ilmu ini boleh bantu siapa? →</button>`);
if(S.step===29)app.innerHTML=shell(10,"Ilmu untuk manfaat",`<p class="lead">Teknologi bawah air membantu penyelidikan laut, operasi menyelamat, pemeriksaan struktur dan memahami hidupan marin.</p><textarea id="ohelp" rows="3" placeholder="Kalau kamu pencipta laut, masalah apa yang kamu mahu bantu selesaikan?"></textarea><button class="primary" onclick="localStorage.kkOceanHelp=document.querySelector('#ohelp').value;localStorage.kkOceanCompleted='1';go(30)">Simpan dalam Pasport 🌟</button>`);
if(S.step===30)app.innerHTML=`<section class="card"><div class="bigemoji">🌊🌟</div><h1>Misi Lautan selesai!</h1><p class="lead">Kamu fikir dahulu, menguji udara yang terperangkap, mengubah satu perkara dan memerhati apa yang berlaku.</p><div class="passport"><strong>Pasport Pencipta #002</strong><div class="summary">🌊 Misi: Bolehkah manusia meneroka di bawah air?<br>🧪 ${S.oceanResult||'Eksperimen dibuat'}<br>🔧 ${S.oceanImprove||'Satu perubahan diuji'}<br>🔁 ${S.oceanRetest||'Hasil diperhatikan'}</div></div><div class="callout">🧠 <b>Jangan iri kuasa khayalan.</b><br>Siasat masalah sebenar.</div><button class="primary" onclick="go(12)">Kembali ke Dunia Khalifah →</button></section>`;
}
render(); if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
